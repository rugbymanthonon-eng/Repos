name: Build Poker Analyzer APK

on:
  push:
    branches: [main]
    paths:
      - 'archive64/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Rebuild verified project archive
        shell: bash
        run: |
          set -euo pipefail
          cat archive64/part-*.txt | tr -d '\n\r' | base64 -d > /tmp/poker-analyzer-v0.5.zip
          echo "53d3e47ede4d5a0d191efb2a034fcfdeae58dad66c7d712b1ea6710246e9ca5d  /tmp/poker-analyzer-v0.5.zip" | sha256sum -c -
          unzip -t /tmp/poker-analyzer-v0.5.zip
          rm -rf build-src
          mkdir build-src
          unzip -q /tmp/poker-analyzer-v0.5.zip -d build-src

      - name: Install dependencies
        working-directory: build-src/poker-analyzer-v0.5
        run: npm install

      - name: Verify poker logic
        working-directory: build-src/poker-analyzer-v0.5
        run: npm run test:logic

      - name: Generate Android project
        working-directory: build-src/poker-analyzer-v0.5
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build installable APK
        working-directory: build-src/poker-analyzer-v0.5/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: cp build-src/poker-analyzer-v0.5/android/app/build/outputs/apk/release/app-release.apk PokerAnalyzer-v0.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PokerAnalyzer-v0.5
          path: PokerAnalyzer-v0.5.apk
          if-no-files-found: error
          retention-days: 7
