name: Build Poker Analyzer APK

on:
  push:
    branches: [main]
    paths:
      - 'poker-analyzer-v0.5.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q poker-analyzer-v0.5.zip -d build-src

      - name: Install dependencies
        working-directory: build-src/poker-analyzer-v0.5
        run: npm install

      - name: Generate Android project
        working-directory: build-src/poker-analyzer-v0.5
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build installable APK
        working-directory: build-src/poker-analyzer-v0.5/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          cp build-src/poker-analyzer-v0.5/android/app/build/outputs/apk/debug/app-debug.apk PokerAnalyzer-v0.5.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokerAnalyzer-v0.5
          path: PokerAnalyzer-v0.5.apk
          if-no-files-found: error

      - name: Create or update private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.0 >/dev/null 2>&1; then
            gh release upload v0.5.0 PokerAnalyzer-v0.5.apk --clobber
          else
            gh release create v0.5.0 PokerAnalyzer-v0.5.apk \
              --target "$GITHUB_SHA" \
              --title "Poker Analyzer V0.5" \
              --notes "APK Android installable de Poker Analyzer V0.5. Dépôt privé : téléchargement réservé au propriétaire du dépôt."
          fi
